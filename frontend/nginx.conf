# Serve o build estático do Vite/React Router. `try_files ... /index.html` é
# o que faz o roteamento client-side funcionar: sem isso, recarregar a página
# numa rota como /admin/tasks daria 404 (o Nginx tentaria achar um arquivo
# literal "/admin/tasks" no disco, que não existe).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
